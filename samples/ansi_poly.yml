# Polyphonic computer-keyboard instrument: each held key spawns a voice (sine osc shaped by an
# ADSR via a VCA).  The engine isolates everything downstream of `keys` into per-voice slots and
# sums them at the output.  Play it with `synth-cli run`.
#
# Key layout (ANSI keyboard):
#
#   ┌────┬────┬────┬────┬────┬────┬────┬────┬────┐
#   │ W  │ E  │    │ T  │ Y  │ U  │    │ O  │ P  │  ← QWERTY row: semitones (black keys)
#   │ C# │ D# │    │ F# │ G# │ A# │    │ C# │ D# │    Q, R, I = unvoiced (piano gaps)
#   ├────┴┬───┴┬───┴┬───┴┬───┴┬───┴┬───┴┬───┴┬───┴┬────┐
#   │  A  │ S  │ D  │ F  │ G  │ H  │ J  │ K  │ L  │ ;  │  ← home row: natural notes (white keys)
#   │  C  │ D  │ E  │ F  │ G  │ A  │ B  │ C  │ D  │ E  │
#   └─────┴────┴────┴────┴────┴────┴────┴────┴────┴────┘
#
#   `  →  toggle keyboard on/off (default: off; suppresses terminal echo while on)
#   Number row  1 2 3 4 5 6 7 8 9  →  select base octave (default 4)
#   Shift  →  new notes +1 octave     Ctrl  →  new notes −1 octave
#   Default octave 4: A = C4 (middle C), H = A4 (440 Hz)
#
# On macOS: the OS will prompt for Accessibility permission on the first run.
version: 1
nodes:
  - id: keys
    type: ansi_keyboard

  - id: amp
    type: const_generator
    params: { value: 1.0 }
  - id: osc
    type: sine_generator

  - id: attack
    type: const_generator
    params: { value: 0.01 }
  - id: decay
    type: const_generator
    params: { value: 0.1 }
  - id: sustain
    type: const_generator
    params: { value: 0.7 }
  - id: release
    type: const_generator
    params: { value: 0.3 }
  - id: env
    type: adsr_envelope

  - id: vca
    type: mul

  - id: out
    type: audio_output
    params: { sample_rate: 44100, channels: 2 }

wires:
  - { from: [keys, pitch], to: [osc, frequency] }
  - { from: [amp,  out],   to: [osc, amplitude] }

  - { from: [keys, gate],   to: [env, gate] }
  - { from: [attack,  out], to: [env, attack] }
  - { from: [decay,   out], to: [env, decay] }
  - { from: [sustain, out], to: [env, sustain] }
  - { from: [release, out], to: [env, release] }

  - { from: [osc, out], to: [vca, in] }
  - { from: [env, out], to: [vca, in] }

  - { from: [vca, out], to: [out, ch0] }
  - { from: [vca, out], to: [out, ch1] }
